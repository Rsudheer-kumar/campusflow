services:
  - type: web
    name: campusflow-api
    runtime: node
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROXY_SECRET
        sync: false

  - type: web
    name: campusflow-web
    runtime: node
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_URL
        value: https://campusflow-4rzn.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: PROXY_SECRET
        sync: false
